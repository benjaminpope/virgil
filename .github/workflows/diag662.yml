name: diag662
on: {push: {branches: [fix-662-kkt-bounded-main-red]}}
jobs:
  d:
    runs-on: ubuntu-latest
    env: {JAX_ENABLE_X64: "1", UV_PYTHON: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra test --extra integrations --group harmonix
      - run: .venv/bin/python diag/d.py
