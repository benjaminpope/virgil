# Author: Jordan Dennis 
# Date: 07/07/2022
# Title: documentation.yml
# Description: Automatically generates the docs on a merge.

name: Documentation
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout all
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6


      - name: python install 
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
          architecture: x64

      - name: create environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[docs]"

      # This is the one docs build for pull requests; deployment happens in
      # zensical-pages.yml on pushes to main.
      - name: build documentation
        run: uv run --python .venv/bin/python mkdocs build --strict

      - name: build documentation (zensical)
        run: uv run --python .venv/bin/python zensical build --clean

      # tests/test_docs_synthetic_recovery.py runs in tests.yml.

