name: upgrade uv.lock

# CI installs from uv.lock (tests.yml), so a new release of JAX or any other
# dependency reaches CI through a pull request of its own, within a day,
# rather than breaking whichever pull request is open. This never pins
# anything back: the lock tracks the newest versions pyproject.toml allows.
#
# The branch is updated by merging main, never by a force push. A push or
# pull request made with GITHUB_TOKEN triggers no workflows, so the tests
# and lint are dispatched on the branch; their checks land on its commit.
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: lock-upgrade
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  BRANCH: deps/uv-lock-upgrade

jobs:
  upgrade:
    name: uv lock --upgrade
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: upgrade the lock on the bot branch
        id: lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
            # main wins any conflict; the lock is regenerated below anyway.
            git merge --no-edit -X theirs origin/main
          else
            git checkout -b "$BRANCH"
          fi
          uv lock --upgrade
          if git diff --quiet origin/main -- uv.lock; then
            echo "uv.lock is already current on main"
            exit 0
          fi
          python3 - <<'PY' > /tmp/changes.md
          import subprocess, tomllib
          def versions(text):
              return {(p["name"], p.get("source", {}).get("registry", "")):
                      p["version"] for p in tomllib.loads(text)["package"]
                      if "version" in p}
          old = versions(subprocess.run(["git", "show", "origin/main:uv.lock"],
                         capture_output=True, text=True, check=True).stdout)
          new = versions(open("uv.lock").read())
          rows = sorted({k[0] for k in old.keys() | new.keys()
                         if old.get(k) != new.get(k)})
          print("| package | main | upgraded |\n|---|---|---|")
          for name in rows:
              o = sorted({v for k, v in old.items() if k[0] == name})
              n = sorted({v for k, v in new.items() if k[0] == name})
              print(f"| {name} | {', '.join(o) or '-'} | {', '.join(n) or '-'} |")
          PY
          cat /tmp/changes.md
          git add uv.lock
          git diff --cached --quiet || git commit -m "Upgrade uv.lock to the newest dependency versions"
          git push origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: open the pull request and run CI on it
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "\`uv lock --upgrade\` from lock-upgrade.yml. CI installs from the lock, so this PR is where new releases (JAX above all) first meet the test suite. If it fails, fix virgil here or in a PR of its own; never pin a dependency back."
            echo
            cat /tmp/changes.md
          } > /tmp/body.md
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "Upgrade uv.lock" --body-file /tmp/body.md
          else
            gh pr edit "$BRANCH" --body-file /tmp/body.md
          fi
          gh workflow run tests.yml --ref "$BRANCH" -f tier=main
          gh workflow run lint.yml --ref "$BRANCH"
