# Publish virgil-astro to PyPI when a GitHub release is published.
#
# Uses PyPI trusted publishing (OIDC): no API tokens are stored anywhere.
# One-time setup, on pypi.org: add a (pending) trusted publisher for the
# project `virgil-astro` with owner `benjaminpope`, repository `virgil`,
# workflow `publish.yml` and environment `pypi`. On GitHub, create the
# environment `pypi` (Settings -> Environments), optionally requiring a
# reviewer. See CONTRIBUTING.md, "Releasing".

name: publish to PyPI
on:
  release:
    types: [published]

jobs:
  # Refuses to build or upload a commit that tests.yml has not passed in
  # the full tier (macOS, py3.13, dependency floors); see CONTRIBUTING.md,
  # "Releasing".
  gate:
    name: the tagged commit passed the full tests
    runs-on: ubuntu-latest
    permissions:
      actions: read  # list the workflow runs of the tagged commit
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            pyproject.toml
            docs/generated/dev_carbon.json
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: python3 .github/scripts/check_release_gate.py
      # The development-carbon page must be refreshed for this version
      # (python3 scripts/dev_carbon.py --release, run locally in the release
      # PR: its inputs are private). A `carbon-gate: skip <reason>` line in
      # the release notes bypasses it with a warning.
      - name: the carbon page was refreshed for this release
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: python3 .github/scripts/check_carbon_fresh.py

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read  # building needs no write access
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # The release tag must match the package version (tag v0.2.0 for
      # version 0.2.0), so that what is published is what was tagged.
      - name: check the tag against the version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match pyproject version ${version}."
            exit 1
          fi

      - name: build the wheel and sdist
        run: uv build

      - name: check the distributions
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/virgil-astro
    permissions:
      id-token: write  # trusted publishing
    steps:
      # Pinned to commits, as this job holds an id-token permission.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
