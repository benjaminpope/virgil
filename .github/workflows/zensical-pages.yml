name: Documentation (Zensical)

# Pull requests are built by documentation.yml; this workflow builds main
# once and (when ZENSICAL_DEPLOY_ENABLED is 'true') deploys that build.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-zensical:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: create environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[docs]"

      - name: build documentation (zensical)
        run: .venv/bin/zensical build --clean

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-zensical-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ZENSICAL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build-zensical
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to a commit, as this job holds write and id-token permissions.
      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
