name: Documentation (Zensical)

# Pull requests are built (not deployed) here; pushes to main are built once
# and (when ZENSICAL_DEPLOY_ENABLED is 'true') deployed.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time. Merges landing in quick succession
# otherwise start overlapping runs and the later deploy fails with "due to in
# progress deployment". Queue main's runs instead (a newer pending run replaces
# an older pending one) and never cancel a deploy that is already under way.
# Each pull request gets its own group, so PR builds never displace a pending
# deploy, and a new push to a PR cancels that PR's older build.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-zensical:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: create environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[docs]"

      # --strict fails the build on warnings: broken cross-references, missing
      # nav pages and dead relative links.
      - name: build documentation (zensical)
        run: .venv/bin/zensical build --clean --strict

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-zensical-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ZENSICAL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build-zensical
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pinned to a commit, as this job holds write and id-token permissions.
      - name: deploy pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
