# ===== mkdocs.yml =====
# Configuration file for the automatic generation of package
# documentation formatted with markdown.

# ===== Setup and Themes =====
markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

site_name: "VIRGIL: Versatile Interferometric Reconstruction and Gradient-based Inference Library"
repo_url: https://github.com/benjaminpope/virgil

theme:
  name: material
  palette:
    scheme: slate
  icon:
    logo: material/telescope
  features:
    - navigation.sections

# ===== Plugins =====
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_source: false
            show_if_no_docstring: true
            members_order: source
            show_category_heading: false

# ===== Navigation =====
nav:
  - Home: index.md
  - Background:
      - Contributors: contributors.md
      - "Gaussian processes and information field theory": gp_and_ift.md
      - Conventions: conventions.md
  - Data Handling:
      - "Reading data: OIFITS and OIData": data_io.md
      - "AMIGO DISCO data": amigo_disco.md
  - Binaries:
      - "Binary search": binary_search.md
      - "Contrast limits": contrast_limits.md
      - "Hierarchical inference across filters": hierarchical_inference.md
  - Sources:
      - "Visibility models": model_syntax.md
      - "Extended source models": source_models.md
      - "Composing models": composition.md
      - "Spotted stars with harmonix": harmonix.md
      - "Limb-darkened stars": limb_darkening.md
      - "Gravity-darkened stars": gravity_darkened_star.md
  - Imaging:
      - "1. Simulating AMI data": imaging_ami.md
      - "2. Regularised maximum likelihood": imaging_rml.md
      - "3. Gaussian-process priors": imaging_gp.md
      - "4. A ring around a binary": imaging_composite.md
      - "5. Sampling the posterior": imaging_sampling.md
  - API Reference:
      - Overview: api/index.md
      - OIData: api/oidata.md
      - OIFITS: api/oifits.md
      - AMIGO: api/amigo.md
      - Models:
          - Overview: api/models/index.md
          - Classes:
              - SourceModel: api/models/classes/source_model.md
              - BinaryModelAngular: api/models/classes/binary_model_angular.md
              - BinaryModelCartesian: api/models/classes/binary_model_cartesian.md
              - System and building blocks: api/models/classes/composition.md
              - Image: api/models/classes/image.md
