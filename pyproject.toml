[project]
name = "virgil-astro"
version = "0.4.1"
description = "VIRGIL, the Versatile Interferometric Reconstruction and Gradient-based Inference Library: modelling and imaging interferometric data in JAX."
readme = "README.md"
requires-python =">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Benjamin Pope", email = "benjamin.pope@mq.edu.au"},
  {name = "Dori Blakely", email = "blakelyd@uvic.ca"},
  {name = "Shashank Dholakia", email = "shashankdholakia1@gmail.com"},
  {name = "Max Charles"},
  {name = "Toon De Prins", email = "toon.deprins@protonmail.com"},
  {name = "Louis Desdoigts", email = "ldes9555@uni.sydney.edu.au"},
  {name = "Jonah Goldfine"},
]
keywords = ["interferometry", "oifits", "aperture-masking", "astronomy", "jax", "autodiff", "differentiable", "image-reconstruction", "virgil"]
dependencies = [
  # Floors are the oldest versions CI tests (the "lowest" job in
  # tests.yml installs exactly these). jax.enable_x64 needs jax 0.8; blackjax needs 0.9.
  # There is deliberately no upper bound: the other jobs in tests.yml
  # upgrade to the newest JAX, and uv.lock tracks it too (JAX 0.11 needs
  # Python 3.12, so Python 3.11 locks the last release that supports it).
  "jax>=0.9.0",  # blackjax 1.7.1 needs jax 0.9
  "jaxbessel>=0.2.0",
  # Adaptive tempered SMC (virgil.smc).
  "blackjax>=1.7.1",
  "equinox>=0.13.2",
  "zodiax>=0.4.1",
  # 0.1.0: before it, a solver whose terminate() returns an unsuccessful
  # result kept looping (only max_steps ended it), which hung fit(method="lm"),
  # whose step bound is traced (fitting._GradientStoppedLM).
  "optimistix>=0.1.0",
  "lineax>=0.1.0",
  "optax>=0.2.6",
  "numpyro>=0.19.0",
  "numpy>=2.0",
  # The NUFFT of large pixel images (pure JAX; needs only jax and numpy).
  "nufftax>=0.6.1",
  # scipy.spatial.ConvexHull triangulates the stellar mesh in _elr.py
  # (jax already depends on scipy).
  "scipy>=1.13",
  "matplotlib>=3.8",
  "astropy>=6.1",
]
classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/benjaminpope/virgil"
Documentation = "https://benjaminpope.github.io/virgil/"
Changelog = "https://github.com/benjaminpope/virgil/blob/main/CHANGELOG.md"
Issues = "https://github.com/benjaminpope/virgil/issues"
Repository = "https://github.com/benjaminpope/virgil"

[project.scripts]
virgil-pipeline = "virgil.pipeline.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
# ChainConsumer corner plots and the pandas tables in virgil.plotting.
plots = [
  "pandas>=2.2.2",
  "chainconsumer>=1.1.3",
]
# The ImPlaneIA-derived writers in virgil.legacy look targets up in SIMBAD.
legacy = [
  "astroquery>=0.4.7",
]
# Keplerian orbits (virgil.orbits) solve Kepler's equation with jaxoplanet.
orbits = [
  "jaxoplanet>=0.1.0",
]
# virgil.radio.ComplexVisData.read_ms reads CASA measurement sets with
# casatools, which has no wheels for Python 3.14 yet (3.12 and 3.13 for the
# newest releases, 3.11 for older ones).
radio = [
  "casatools>=6.6; python_version < '3.14'",
]
# Spherical-harmonic stars (HarmonixModel) need jaxoplanet, and harmonix
# itself (`pip install "harmonix>=0.1.0"`, on PyPI), which is not an extra.
integrations = [
  "virgil-astro[orbits]",
]
# virgil.pipeline: HDF5 outputs and the executed quicklook notebook (and
# the corner plots of the plots extra).
pipeline = [
  "h5py>=3.11",  # first release built against numpy 2
  "nbformat>=5.9",
  "nbclient>=0.9",
  "ipykernel>=6.25",
  "virgil-astro[plots]",
]
test = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "pytest-timeout>=2.3",
  "pyoifits>=0.4.10",
  "virgil-astro[plots,pipeline]",
]
notebooks = [
  "tqdm>=4.66",
  "ipywidgets>=8.0",
  "virgil-astro[plots,integrations]",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.30",
  "zensical>=0.0.62,<0.1",
  "towncrier>=24.8",
]
dev = [
  # orbits, so the orbit and alias tests run locally instead of skipping.
  "virgil-astro[test,docs,orbits]",
  "ruff==0.11.0",
  "pre-commit",
  "build",
  "twine",
]

# Changelog fragments in changelog.d/ (see its README); the release PR runs
# `towncrier build --yes --version X.Y.Z` to collect them into CHANGELOG.md.
[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/benjaminpope/virgil/pull/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "default"
name = "Changes to default behaviour"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Docs"
showcontent = true

[dependency-groups]
# harmonix is not an extra (see integrations above). CI installs it from
# uv.lock with `uv sync --locked --group harmonix`, so its tests run against
# a locked version like everything else.
harmonix = ["harmonix>=0.1.0"]

[tool.ruff]
line-length = 79
# Must match the rev in .pre-commit-config.yaml and RUFF_VERSION in the workflows.
required-version = "==0.11.0"
force-exclude = true
extend-exclude = [
  "site",
  "docs/generated",
  "notebooks/archive",
]

[tool.ruff.lint]
# W605: an invalid escape such as a LaTeX backslash ($\mu$) in a docstring
# that is not a raw string; Python warns on every fresh compile.
select = ["E", "F", "ICN", "W605"]
ignore = ["E402", "E501", "E721", "E731", "E741", "F722"]

[tool.ruff.lint.flake8-import-conventions]
# jax.numpy is `np` and plain NumPy is `onp` throughout (AGENTS.md).
aliases = { "jax.numpy" = "np", "numpy" = "onp" }

[tool.ruff.lint.per-file-ignores]
# Notebooks keep their old aliases until they are next re-executed: editing
# a code cell invalidates the stamped outputs (see AGENTS.md).
"notebooks/**/*.ipynb" = ["ICN001"]
"src/virgil/__init__.py" = ["F401"]
"notebooks/contrast_limits.ipynb" = ["E702"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# A test that runs past 5 minutes has hung: pytest-timeout fails it (and
# dumps every thread's traceback) instead of holding the runner until the
# job times out. The duration budget for ordinary tests is much tighter
# (tests/conftest.py).
timeout = 300
# The 0.4 argument-order shims (virgil._deprecate) warn on the 0.3 order and
# the old argument names. No virgil code, test or tutorial may use them; the
# tests of the shims opt in with pytest.warns.
filterwarnings = [
    "error:.*now takes the model before the data:FutureWarning",
    "error:.*stops working in virgil 0.5:FutureWarning",
]
