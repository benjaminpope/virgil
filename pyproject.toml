[project]
name = "virgil-astro"
version = "0.3.0"
description = "VIRGIL, the Versatile Interferometric Reconstruction and Gradient-based Inference Library: modelling and imaging interferometric data in JAX."
readme = "README.md"
requires-python =">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Benjamin Pope", email = "benjamin.pope@mq.edu.au"},
  {name = "Dori Blakely", email = "blakelyd@uvic.ca"},
  {name = "Shashank Dholakia", email = "shashankdholakia1@gmail.com"},
  {name = "Max Charles"},
  {name = "Toon De Prins", email = "toon.deprins@protonmail.com"},
  {name = "Louis Desdoigts", email = "ldes9555@uni.sydney.edu.au"},
]
keywords = ["python", "optics", "machine-learning", "jax", "autodiff", "differentiable", "diffraction", "simulation", "telescope", "virgil"]
urls = {repository = "https://github.com/benjaminpope/virgil"}
dependencies = [
  # Floors are the oldest versions CI tests (the "lowest" job in
  # tests.yml installs exactly these). jax.enable_x64 needs jax 0.8.
  # There is deliberately no upper bound: the other jobs in tests.yml
  # upgrade to the newest JAX, and uv.lock tracks it too (JAX 0.11 needs
  # Python 3.12, so Python 3.11 locks the last release that supports it).
  "jax>=0.8.0",
  "jaxbessel>=0.2.0",
  "equinox>=0.13.2",
  "zodiax>=0.4.1",
  "optimistix>=0.0.11",
  "lineax>=0.1.0",
  "optax>=0.2.6",
  "numpyro>=0.19.0",
  "numpy>=2.0",
  # scipy.spatial.ConvexHull triangulates the stellar mesh in _elr.py
  # (jax already depends on scipy).
  "scipy>=1.13",
  "matplotlib>=3.8",
  "astropy>=6.1",
]
classifiers=[
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.scripts]
virgil-pipeline = "virgil.pipeline.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
# ChainConsumer corner plots and the pandas tables in virgil.plotting.
plots = [
  "pandas>=2.2.2",
  "chainconsumer>=1.1.3",
]
# The ImPlaneIA-derived writers in virgil.legacy look targets up in SIMBAD.
legacy = [
  "astroquery>=0.4.7",
]
# Keplerian orbits (virgil.orbits) solve Kepler's equation with jaxoplanet.
orbits = [
  "jaxoplanet>=0.1.0",
]
# Spherical-harmonic stars (HarmonixModel) need jaxoplanet, and harmonix
# itself (`pip install "harmonix>=0.1.0"`, on PyPI), which is not an extra.
integrations = [
  "virgil-astro[orbits]",
]
# virgil.pipeline: HDF5 outputs and the executed quicklook notebook (and
# the corner plots of the plots extra).
pipeline = [
  "h5py>=3.10",
  "nbformat>=5.9",
  "nbclient>=0.9",
  "ipykernel>=6.25",
  "virgil-astro[plots]",
]
test = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "pyoifits>=0.4.10",
  "virgil-astro[plots,pipeline]",
]
notebooks = [
  "tqdm>=4.66",
  "ipywidgets>=8.0",
  "virgil-astro[plots,integrations]",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.30",
  "zensical>=0.0.62,<0.1",
]
dev = [
  "virgil-astro[test,docs]",
  "ruff==0.11.0",
  "pre-commit",
  "build",
  "twine",
]

[tool.ruff]
line-length = 79
# Must match the rev in .pre-commit-config.yaml and RUFF_VERSION in the workflows.
required-version = "==0.11.0"
force-exclude = true
extend-exclude = [
  "site",
  "docs/generated",
  "notebooks/archive",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501", "E721", "E731", "E741", "F722"]

[tool.ruff.lint.per-file-ignores]
"src/virgil/__init__.py" = ["F401"]
"notebooks/contrast_limits.ipynb" = ["E702"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# Dump every thread's traceback when a test runs past 5 minutes, so a hung
# CI job shows where it stopped. It only prints; the test carries on.
faulthandler_timeout = 300
# The 0.4 argument-order shims (virgil._deprecate) warn on the 0.3 order and
# the old argument names. No virgil code, test or tutorial may use them; the
# tests of the shims opt in with pytest.warns.
filterwarnings = [
    "error:.*now takes the model before the data:FutureWarning",
    "error:.*stops working in virgil 0.5:FutureWarning",
]
