# Provenance of the methods in virgil. docs/references.md is generated from this file
# (scripts/sync_references_page.py); see design/provenance.md for how to maintain it.
# Fields: authors, year, title, arxiv, doi, verified (checked against the arXiv abstract page
# or Crossref; ADS resolution with scripts/fetch_references.py gives the final check),
# verified_via, used_in (module:symbol), note, url, repo (a GitHub URL), how ("ported" when
# code was adapted; the default, "after", means the idea was reimplemented).
# Entries with neither arxiv nor doi are unverified until scripts/fetch_references.py
# resolves them against ADS.
# role: absent = a source of an idea or code; "compared" = studied for comparison, not
# ported; "context" = background literature cited in the docs; "bibliography" = in
# virgil.bib for the paper, not provenance.

